<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">Blackfield: reading stages</title><desc id="desc">Source section order, not a verified attack chain. Recon → Access as support → Access as audit2020 → Shell as svc_backup → Priv: svc_backup –&gt; administrator</desc><rect width="720" height="650" fill="#f3f6f5" rx="20"/><text x="40" y="45" font-family="sans-serif" font-size="25" font-weight="bold" fill="#173e39">Blackfield · learning map</text><text x="40" y="75" font-family="sans-serif" font-size="16" fill="#425b59">Read each stage → identify the evidence → check the boundary</text><rect x="40" y="100" width="640" height="65" rx="12" fill="#193f39"/><text x="62" y="140" font-family="sans-serif" font-size="20" fill="white">1. Recon</text><path d="M360 172v22m-7-7 7 7 7-7" fill="none" stroke="#27806c" stroke-width="3"/><rect x="40" y="205" width="640" height="65" rx="12" fill="#193f39"/><text x="62" y="245" font-family="sans-serif" font-size="20" fill="white">2. Access as support</text><path d="M360 277v22m-7-7 7 7 7-7" fill="none" stroke="#27806c" stroke-width="3"/><rect x="40" y="310" width="640" height="65" rx="12" fill="#193f39"/><text x="62" y="350" font-family="sans-serif" font-size="20" fill="white">3. Access as audit2020</text><path d="M360 382v22m-7-7 7 7 7-7" fill="none" stroke="#27806c" stroke-width="3"/><rect x="40" y="415" width="640" height="65" rx="12" fill="#193f39"/><text x="62" y="455" font-family="sans-serif" font-size="20" fill="white">4. Shell as svc_backup</text><path d="M360 487v22m-7-7 7 7 7-7" fill="none" stroke="#27806c" stroke-width="3"/><rect x="40" y="520" width="640" height="65" rx="12" fill="#193f39"/><text x="62" y="560" font-family="sans-serif" font-size="20" fill="white">5. Priv: svc_backup –&gt; administrator</text></svg>