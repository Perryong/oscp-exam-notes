<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">Enumeration is an evidence loop</title><desc id="desc">Scope, discover, map ports, identify services, verify and record, then revisit unanswered questions.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#76d5be"/></marker></defs><rect width="1040" height="580" rx="24" fill="#14252c"/><g font-family="system-ui,sans-serif" fill="#e8f1ef"><text x="48" y="64" font-size="34" font-weight="700">Enumeration is an evidence loop</text><g stroke="#76d5be" fill="none" stroke-width="4" marker-end="url(#arrow)"><path d="M320 180H382"/><path d="M652 180H714"/><path d="M850 234V320"/><path d="M720 380H660"/><path d="M390 380H330"/></g><g fill="#213e46" stroke="#619b91" stroke-width="2"><rect x="48" y="126" width="272" height="108" rx="16"/><rect x="384" y="126" width="268" height="108" rx="16"/><rect x="716" y="126" width="276" height="108" rx="16"/><rect x="720" y="324" width="272" height="108" rx="16"/><rect x="388" y="324" width="270" height="108" rx="16"/><rect x="48" y="324" width="276" height="108" rx="16"/></g><g font-size="27" text-anchor="middle"><text x="184" y="172">1 · Confirm scope</text><text x="184" y="209" fill="#b9d3cd">Which hosts?</text><text x="518" y="172">2 · Discover hosts</text><text x="518" y="209" fill="#b9d3cd">What responds?</text><text x="854" y="172">3 · Map ports</text><text x="854" y="209" fill="#b9d3cd">Which protocol?</text><text x="856" y="370">4 · Probe services</text><text x="856" y="407" fill="#b9d3cd">What is running?</text><text x="523" y="370">5 · Test a hypothesis</text><text x="523" y="407" fill="#b9d3cd">What changed?</text><text x="186" y="370">6 · Save evidence</text><text x="186" y="407" fill="#b9d3cd">Can I reproduce it?</text></g><text x="48" y="508" font-size="26" fill="#76d5be">Revisit gaps rather than collecting flags without a question.</text></g></svg>