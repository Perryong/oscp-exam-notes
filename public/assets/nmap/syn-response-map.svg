<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc"><title id="title">Read responses before assigning meaning</title><desc id="desc">For a TCP SYN scan, SYN ACK supports open, reset supports closed, and silence or filtering errors require interpretation. UDP silence remains ambiguous.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#76d5be"/></marker></defs><rect width="1040" height="600" rx="24" fill="#14252c"/><g font-family="system-ui,sans-serif" fill="#e8f1ef"><text x="48" y="64" font-size="34" font-weight="700">Read responses before assigning meaning</text><g font-size="28"><text x="56" y="133" fill="#76d5be">Scanner sends TCP SYN to one target port</text><g fill="#213e46"><rect x="48" y="162" width="944" height="76" rx="14"/><rect x="48" y="254" width="944" height="76" rx="14"/><rect x="48" y="346" width="944" height="98" rx="14"/></g><text x="72" y="209">SYN/ACK received</text><text x="540" y="209" fill="#76d5be">open · scanner normally resets</text><text x="72" y="301">RST received</text><text x="540" y="301" fill="#76d5be">closed · host is reachable</text><text x="72" y="387">No reply after retries</text><text x="72" y="423">or relevant ICMP error</text><text x="540" y="400" fill="#f5cd86">filtered · inspect the path</text><text x="56" y="506" font-size="26">UDP silence is different: open|filtered, not proof of a service.</text><text x="56" y="548" font-size="23" fill="#b9d3cd">States describe the scanner’s observation, not an intrinsic port property.</text></g></g></svg>