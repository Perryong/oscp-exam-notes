<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">Faster is useful only if evidence survives</title><desc id="desc">Compare the same target and ports while changing one timing setting. Preserve both result sets, investigate differences and repeat uncertain observations.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#76d5be"/></marker></defs><rect width="1040" height="580" rx="24" fill="#14252c"/><g font-family="system-ui,sans-serif" fill="#e8f1ef"><text x="48" y="64" font-size="34" font-weight="700">Faster is useful only if evidence survives</text><g fill="#213e46" stroke="#619b91" stroke-width="2"><rect x="48" y="126" width="432" height="226" rx="16"/><rect x="560" y="126" width="432" height="226" rx="16"/></g><g font-size="28"><text x="76" y="173" fill="#76d5be">Baseline scan</text><text x="76" y="224">Same target and ports</text><text x="76" y="270">Default / measured timing</text><text x="76" y="316">Save XML + command</text><text x="588" y="173" fill="#76d5be">One changed setting</text><text x="588" y="224">Same network position</text><text x="588" y="270">Observe time and retries</text><text x="588" y="316">Save a new result stem</text><path d="M490 239H548" stroke="#76d5be" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="421">Compare: elapsed time · port states · missing responses</text><text x="48" y="476" fill="#f5cd86">Unexpected differences? Retry with more conservative settings.</text><text x="48" y="533" fill="#b9d3cd" font-size="24">A smaller result set may mean lost evidence, not fewer services.</text></g></g></svg>