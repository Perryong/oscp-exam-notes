<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Visibility is only one boundary</title><desc id="desc">Each observation supports a narrower conclusion than “I have access”.</desc><rect width="1040" height="620" rx="24" fill="#12272f"/><g font-family="system-ui, sans-serif" fill="#edf6f4"><text x="40" y="58" font-size="34" font-weight="700">Visibility is only one boundary</text><text x="40" y="94" font-size="22" fill="#b5ceca">Each observation supports a narrower conclusion than “I have access”.</text><g><rect x="40" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="158" fill="#90e1cc" font-size="26" font-weight="700">1 · Reachable</text><text x="62" y="190" font-size="22">A connection or reply was observed.</text><text x="62" y="218" font-size="22">Filtering and transport still matter.</text></g><g><rect x="540" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="158" fill="#90e1cc" font-size="26" font-weight="700">2 · Protocol confirmed</text><text x="562" y="190" font-size="22">The response matches a service.</text><text x="562" y="218" font-size="22">A banner may be configured or stale.</text></g><g><rect x="40" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="292" fill="#90e1cc" font-size="26" font-weight="700">3 · Identity accepted</text><text x="62" y="324" font-size="22">Anonymous, guest or a known account?</text><text x="62" y="352" font-size="22">Record the server’s effective identity.</text></g><g><rect x="540" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="292" fill="#90e1cc" font-size="26" font-weight="700">4 · Object visible</text><text x="562" y="324" font-size="22">A share, schema or mailbox is listed.</text><text x="562" y="352" font-size="22">Its contents may still be restricted.</text></g><g><rect x="40" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="426" fill="#90e1cc" font-size="26" font-weight="700">5 · Operation permitted</text><text x="62" y="458" font-size="22">A specific authorized read succeeded.</text><text x="62" y="486" font-size="22">Write access remains a separate test.</text></g><g><rect x="540" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="426" fill="#90e1cc" font-size="26" font-weight="700">6 · Evidence retained</text><text x="562" y="458" font-size="22">Target + time + identity + operation.</text><text x="562" y="486" font-size="22">Avoid passwords and private contents.</text></g><text x="40" y="576" font-size="23" fill="#90e1cc">Never turn a visible object into an unsupported read/write or admin claim.</text></g></svg>