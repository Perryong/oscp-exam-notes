<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Turn a clue into a supported relationship</title><desc id="desc">A repeatable lab workflow for cross-service findings.</desc><rect width="1040" height="620" rx="24" fill="#12272f"/><g font-family="system-ui, sans-serif" fill="#edf6f4"><text x="40" y="58" font-size="34" font-weight="700">Turn a clue into a supported relationship</text><text x="40" y="94" font-size="22" fill="#b5ceca">A repeatable lab workflow for cross-service findings.</text><g><rect x="40" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="158" fill="#90e1cc" font-size="26" font-weight="700">Observe</text><text x="62" y="190" font-size="22">Capture one relevant service response.</text><text x="62" y="218" font-size="22">Record where and when it appeared.</text></g><g><rect x="540" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="158" fill="#90e1cc" font-size="26" font-weight="700">Check scope</text><text x="562" y="190" font-size="22">Is the related asset explicitly allowed?</text><text x="562" y="218" font-size="22">Discovery alone never expands scope.</text></g><g><rect x="40" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="292" fill="#90e1cc" font-size="26" font-weight="700">Form a hypothesis</text><text x="62" y="324" font-size="22">Name the relationship you suspect.</text><text x="62" y="352" font-size="22">Include an alternative explanation.</text></g><g><rect x="540" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="292" fill="#90e1cc" font-size="26" font-weight="700">Choose a narrow check</text><text x="562" y="324" font-size="22">Use the right protocol and identity.</text><text x="562" y="352" font-size="22">Prefer a small read-only observation.</text></g><g><rect x="40" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="426" fill="#90e1cc" font-size="26" font-weight="700">Compare evidence</text><text x="62" y="458" font-size="22">Did the result support the hypothesis?</text><text x="62" y="486" font-size="22">Keep failures and uncertainty visible.</text></g><g><rect x="540" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="426" fill="#90e1cc" font-size="26" font-weight="700">Review your learning</text><text x="562" y="458" font-size="22">Goal → attempt → result → blocker.</text><text x="562" y="486" font-size="22">Choose the next authorized action.</text></g><text x="40" y="576" font-size="23" fill="#90e1cc">Repeat when new evidence changes the picture; do not collect data without a question.</text></g></svg>