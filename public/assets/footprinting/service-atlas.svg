<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">A service map for your first pass</title><desc id="desc">Common ports are starting clues; verify transport and actual configuration.</desc><rect width="1040" height="620" rx="24" fill="#12272f"/><g font-family="system-ui, sans-serif" fill="#edf6f4"><text x="40" y="58" font-size="34" font-weight="700">A service map for your first pass</text><text x="40" y="94" font-size="22" fill="#b5ceca">Common ports are starting clues; verify transport and actual configuration.</text><g><rect x="40" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="158" fill="#90e1cc" font-size="26" font-weight="700">Files</text><text x="62" y="190" font-size="22">FTP 21/TCP · SMB 445/TCP</text><text x="62" y="218" font-size="22">NFS 2049 · transport/version vary</text></g><g><rect x="540" y="124" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="158" fill="#90e1cc" font-size="26" font-weight="700">Names and mail</text><text x="562" y="190" font-size="22">DNS 53/UDP + TCP · SMTP 25/587/465</text><text x="562" y="218" font-size="22">IMAP 143/993 · POP3 110/995</text></g><g><rect x="40" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="292" fill="#90e1cc" font-size="26" font-weight="700">Databases</text><text x="62" y="324" font-size="22">MySQL 3306 · MSSQL often 1433</text><text x="62" y="352" font-size="22">Oracle listener often 1521/TCP</text></g><g><rect x="540" y="258" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="292" fill="#90e1cc" font-size="26" font-weight="700">Management</text><text x="562" y="324" font-size="22">SSH 22 · RDP 3389/TCP</text><text x="562" y="352" font-size="22">WinRM 5985/5986 · WMI via RPC</text></g><g><rect x="40" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="62" y="426" fill="#90e1cc" font-size="26" font-weight="700">Device metadata</text><text x="62" y="458" font-size="22">SNMP 161/UDP · IPMI 623/UDP</text><text x="62" y="486" font-size="22">Credentials and security modes differ</text></g><g><rect x="540" y="392" width="460" height="112" rx="16" fill="#203b46" stroke="#517d83"/><text x="562" y="426" fill="#90e1cc" font-size="26" font-weight="700">Check before you conclude</text><text x="562" y="458" font-size="22">Port → protocol → accepted identity</text><text x="562" y="486" font-size="22">Then test only the permitted operation</text></g><text x="40" y="576" font-size="23" fill="#90e1cc">Record service, identity and evidence together; keep untested access unknown.</text></g></svg>